<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">배지 (Badge)</h1>
  <p class="text-neutral-600 mb-8">상태·카테고리를 표시하는 레이블</p>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Variants</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-wrap gap-3 items-center">
      <span class="np-badge np-badge-primary">Primary</span>
      <span class="np-badge np-badge-neutral">Neutral</span>
      <span class="np-badge np-badge-success">Success</span>
      <span class="np-badge np-badge-warning">Warning</span>
      <span class="np-badge np-badge-error">Error</span>
      <span class="np-badge np-badge-info">Info</span>
      <span class="np-badge np-badge-gradient">Gradient</span>
    </div>
  </section>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">실사용 예시 — 채용 공고 카드</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-5 flex flex-col gap-3">
      <div class="flex gap-2 flex-wrap">
        <span class="np-badge np-badge-primary">신규</span>
        <span class="np-badge np-badge-success">채용 중</span>
        <span class="np-badge np-badge-neutral">정규직</span>
      </div>
      <div>
        <p class="text-xl font-bold text-neutral-900">마케팅 총괄 디렉터</p>
        <p class="text-lg text-neutral-600 mt-1">(주)넥스트파트너 · 서울 강남구</p>
      </div>
      <div class="flex gap-2">
        <span class="np-badge np-badge-info">경력 10년+</span>
        <span class="np-badge np-badge-warning">마감 임박</span>
      </div>
    </div>
  </section>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">실사용 예시 — 지원 현황</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card divide-y divide-neutral-100">
      <div class="flex items-center justify-between px-4 py-4">
        <span class="text-lg text-neutral-800">넥스트파트너 마케팅 팀장</span>
        <span class="np-badge np-badge-info">서류 검토</span>
      </div>
      <div class="flex items-center justify-between px-4 py-4">
        <span class="text-lg text-neutral-800">커머스코 영업 본부장</span>
        <span class="np-badge np-badge-success">최종 합격</span>
      </div>
      <div class="flex items-center justify-between px-4 py-4">
        <span class="text-lg text-neutral-800">그로스랩 사업개발 이사</span>
        <span class="np-badge np-badge-warning">면접 예정</span>
      </div>
      <div class="flex items-center justify-between px-4 py-4">
        <span class="text-lg text-neutral-800">시니어코어 운영 매니저</span>
        <span class="np-badge np-badge-error">불합격</span>
      </div>
    </div>
  </section>
</div>
