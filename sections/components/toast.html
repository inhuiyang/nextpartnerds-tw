<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">토스트 (Toast)</h1>
  <p class="text-neutral-600 mb-8">일시적으로 표시되는 알림 메시지</p>

  <!-- Variants -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Variants</h2>
    <div class="bg-neutral-100 border border-neutral-200 rounded-card p-6 flex flex-col items-start gap-4">

      <!-- Default -->
      <div class="np-toast">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="shrink-0 text-neutral-400"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>저장되었습니다</span>
      </div>

      <!-- Success -->
      <div class="np-toast">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="shrink-0 text-success-500"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>지원이 완료되었습니다</span>
      </div>

      <!-- Warning -->
      <div class="np-toast">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="shrink-0 text-warning-500"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>이력서를 먼저 등록해주세요</span>
      </div>

      <!-- Error -->
      <div class="np-toast">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="shrink-0 text-error-500"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>오류가 발생했습니다. 다시 시도해주세요</span>
      </div>

      <!-- Info -->
      <div class="np-toast">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="shrink-0 text-info-500"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>새로운 공고 3건이 등록되었습니다</span>
      </div>

    </div>
  </section>

  <!-- With Action / Close -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">With Action & Close</h2>
    <div class="bg-neutral-100 border border-neutral-200 rounded-card p-6 flex flex-col items-start gap-4">

      <!-- With Action -->
      <div class="np-toast">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="shrink-0 text-success-500"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>스크랩에 추가되었습니다</span>
        <span class="np-toast-action">보기</span>
      </div>

      <!-- With Close -->
      <div class="np-toast">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="shrink-0 text-info-500"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>알림이 설정되었습니다</span>
        <button class="np-toast-close">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

    </div>
  </section>

  <!-- Interactive Demo -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Interactive Demo</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6">
      <p class="text-sm text-neutral-500 mb-4">버튼을 클릭하면 화면 하단에 토스트가 표시됩니다</p>
      <div class="flex flex-wrap gap-3">
        <button class="np-btn np-btn-primary np-btn-sm" data-toast="success">성공</button>
        <button class="np-btn np-btn-secondary np-btn-sm" data-toast="warning">경고</button>
        <button class="np-btn np-btn-ghost np-btn-sm" data-toast="error">오류</button>
        <button class="np-btn np-btn-grey np-btn-sm" data-toast="info">정보</button>
        <button class="np-btn np-btn-grey np-btn-sm" data-toast="action">액션 포함</button>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
  var TOASTS = {
    success: { icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z',   color: '#4caf50', msg: '지원이 완료되었습니다' },
    warning: { icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z', color: '#ff9800', msg: '이력서를 먼저 등록해주세요' },
    error:   { icon: 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z', color: '#f44336', msg: '오류가 발생했습니다. 다시 시도해주세요' },
    info:    { icon: 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z', color: '#2196f3', msg: '새로운 공고 3건이 등록되었습니다' },
    action:  { icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z', color: '#4caf50', msg: '스크랩에 추가되었습니다', action: '보기' },
  };

  var wrap = document.createElement('div');
  wrap.className = 'np-toast-wrap';
  document.body.appendChild(wrap);

  function showToast(type) {
    var cfg = TOASTS[type];
    if (!cfg) return;

    var el = document.createElement('div');
    el.className = 'np-toast';
    el.style.animation = 'np-toast-in 200ms ease-out';

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', '20'); svg.setAttribute('height', '20');
    svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', cfg.color);
    svg.setAttribute('stroke-width', '2.5'); svg.setAttribute('viewBox', '0 0 24 24');
    svg.style.flexShrink = '0';
    var path = document.createElementNS(svgNS, 'path');
    path.setAttribute('stroke-linecap', 'round'); path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('d', cfg.icon);
    svg.appendChild(path);
    el.appendChild(svg);

    var span = document.createElement('span');
    span.textContent = cfg.msg;
    el.appendChild(span);

    if (cfg.action) {
      var act = document.createElement('span');
      act.className = 'np-toast-action';
      act.textContent = cfg.action;
      el.appendChild(act);
    }

    wrap.appendChild(el);

    var timer = setTimeout(function () { dismiss(el); }, 3000);
    el.addEventListener('click', function (e) {
      if (e.target.closest('.np-toast-action') || e.target === el) {
        clearTimeout(timer);
        dismiss(el);
      }
    });
  }

  function dismiss(el) {
    el.style.animation = 'np-toast-out 200ms ease-in forwards';
    el.addEventListener('animationend', function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, { once: true });
  }

  function onClick(e) {
    var btn = e.target.closest('[data-toast]');
    if (btn) showToast(btn.dataset.toast);
  }

  document.addEventListener('click', onClick);

  window._sectionCleanup = function () {
    document.removeEventListener('click', onClick);
    if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap);
  };
})();
</script>
