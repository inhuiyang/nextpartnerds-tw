<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">토스트 (Toast)</h1>
  <p class="text-neutral-600 mb-8">일시적으로 표시되는 알림 메시지</p>

  <!-- Variants -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Variants</h2>
    <div class="bg-neutral-100 border border-neutral-200 rounded-card p-6 flex flex-col items-start gap-4">

      <!-- Default -->
      <div>
        <p class="text-xs text-neutral-400 mb-2">Default</p>
        <div class="np-toast">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" style="stroke:#999999;stroke-width:2;flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>저장되었습니다</span>
        </div>
      </div>

      <!-- Info -->
      <div>
        <p class="text-xs text-neutral-400 mb-2">Info</p>
        <div class="np-toast">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" style="stroke:#2196f3;stroke-width:2.5;flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>새로운 공고 3건이 등록되었습니다</span>
        </div>
      </div>

      <!-- Success -->
      <div>
        <p class="text-xs text-neutral-400 mb-2">Success</p>
        <div class="np-toast">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" style="stroke:#4caf50;stroke-width:2.5;flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>지원이 완료되었습니다</span>
        </div>
      </div>

      <!-- Warning -->
      <div>
        <p class="text-xs text-neutral-400 mb-2">Warning</p>
        <div class="np-toast">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" style="stroke:#ff9800;stroke-width:2.5;flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <span>이력서를 먼저 등록해주세요</span>
        </div>
      </div>

      <!-- Error -->
      <div>
        <p class="text-xs text-neutral-400 mb-2">Error</p>
        <div class="np-toast">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" style="flex-shrink:0">
            <circle cx="12" cy="12" r="9" stroke="#f44336" stroke-width="2.5" fill="none"/>
            <path stroke="#f44336" stroke-width="2.5" stroke-linecap="round" d="M9 9l6 6M15 9l-6 6"/>
          </svg>
          <span>오류가 발생했습니다. 다시 시도해주세요</span>
        </div>
      </div>

    </div>
  </section>

  <!-- With Action / Close -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">With Action & Close</h2>
    <div class="bg-neutral-100 border border-neutral-200 rounded-card p-6 flex flex-col items-start gap-4">

      <!-- With Action -->
      <div>
        <p class="text-xs text-neutral-400 mb-2">With Action</p>
        <div class="np-toast">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" style="stroke:#4caf50;stroke-width:2.5;flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>스크랩에 추가되었습니다</span>
          <span class="np-toast-action">보기</span>
        </div>
      </div>

      <!-- With Close -->
      <div>
        <p class="text-xs text-neutral-400 mb-2">With Close</p>
        <div class="np-toast">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" style="stroke:#2196f3;stroke-width:2.5;flex-shrink:0"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>알림이 설정되었습니다</span>
          <button class="np-toast-close">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

    </div>
  </section>

  <!-- Interactive Demo -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Interactive Demo</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6">
      <p class="text-sm text-neutral-500 mb-4">버튼을 클릭하면 화면 하단에 토스트가 표시됩니다</p>
      <div class="flex flex-wrap gap-3">
        <button class="np-btn np-btn-grey np-btn-sm"    data-toast="default">Default</button>
        <button class="np-btn np-btn-grey np-btn-sm"    data-toast="info">Info</button>
        <button class="np-btn np-btn-primary np-btn-sm" data-toast="success">Success</button>
        <button class="np-btn np-btn-secondary np-btn-sm" data-toast="warning">Warning</button>
        <button class="np-btn np-btn-ghost np-btn-sm"   data-toast="error">Error</button>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
  var TOASTS = {
    default: { stroke: '#999999', icon: 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z', msg: '저장되었습니다' },
    info:    { stroke: '#2196f3', icon: 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z', msg: '새로운 공고 3건이 등록되었습니다' },
    success: { stroke: '#4caf50', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z', msg: '지원이 완료되었습니다' },
    warning: { stroke: '#ff9800', icon: 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z', msg: '이력서를 먼저 등록해주세요' },
    error:   { stroke: '#f44336', icon: null, msg: '오류가 발생했습니다. 다시 시도해주세요' },
  };

  var wrap = document.createElement('div');
  wrap.className = 'np-toast-wrap';
  document.body.appendChild(wrap);

  function showToast(type) {
    var cfg = TOASTS[type];
    if (!cfg) return;

    var el = document.createElement('div');
    el.className = 'np-toast';
    el.style.animation = 'np-toast-in 200ms ease-out';

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', '20'); svg.setAttribute('height', '20');
    svg.setAttribute('fill', 'none'); svg.setAttribute('viewBox', '0 0 24 24');
    svg.style.flexShrink = '0';
    if (cfg.icon === null) {
      var circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', '12'); circle.setAttribute('cy', '12'); circle.setAttribute('r', '9');
      circle.setAttribute('stroke', cfg.stroke); circle.setAttribute('stroke-width', '2.5'); circle.setAttribute('fill', 'none');
      svg.appendChild(circle);
      var xPath = document.createElementNS(svgNS, 'path');
      xPath.setAttribute('stroke', cfg.stroke); xPath.setAttribute('stroke-width', '2.5');
      xPath.setAttribute('stroke-linecap', 'round'); xPath.setAttribute('d', 'M9 9l6 6M15 9l-6 6');
      svg.appendChild(xPath);
    } else {
      var path = document.createElementNS(svgNS, 'path');
      path.setAttribute('stroke', cfg.stroke); path.setAttribute('stroke-width', '2.5');
      path.setAttribute('stroke-linecap', 'round'); path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('d', cfg.icon);
      svg.appendChild(path);
    }
    el.appendChild(svg);

    var span = document.createElement('span');
    span.textContent = cfg.msg;
    el.appendChild(span);

    wrap.appendChild(el);

    var timer = setTimeout(function () { dismiss(el); }, 3000);
    el.addEventListener('click', function () { clearTimeout(timer); dismiss(el); });
  }

  function dismiss(el) {
    el.style.animation = 'np-toast-out 200ms ease-in forwards';
    el.addEventListener('animationend', function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, { once: true });
  }

  function onClick(e) {
    var btn = e.target.closest('[data-toast]');
    if (btn) showToast(btn.dataset.toast);
  }

  document.addEventListener('click', onClick);

  window._sectionCleanup = function () {
    document.removeEventListener('click', onClick);
    if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap);
  };
})();
</script>
