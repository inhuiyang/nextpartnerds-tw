<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">네비게이션 바 & 상단앱바</h1>
  <p class="text-neutral-600 mb-8">Bottom Navigation Bar · Top App Bar</p>

  <!-- ── 상단앱바 ── -->
  <h2 class="text-xl font-bold text-neutral-900 mb-1">상단앱바 (Top App Bar)</h2>
  <p class="text-neutral-600 mb-6">화면 상단 탐색 영역</p>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-3">Basic — 뒤로가기 + 타이틀</h2>
    <div class="border border-neutral-200 rounded-card overflow-hidden">
      <div class="np-app-bar">
        <button class="np-app-bar-btn">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <span class="np-app-bar-title">일자리 검색</span>
      </div>
    </div>
  </section>

  <!-- ── 네비게이션 바 ── -->
  <div class="border-t border-neutral-200 my-10"></div>
  <h2 class="text-xl font-bold text-neutral-900 mb-1">네비게이션 바 (Bottom Navigation Bar)</h2>
  <p class="text-neutral-600 mb-6">하단 탭 네비게이션</p>

  <!-- Default: 홈 선택 -->
  <section class="mb-6">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-3">Default — 홈 선택</h2>
    <div class="border border-neutral-200 rounded-card overflow-hidden">
      <nav class="np-bottom-nav">

        <div class="np-bottom-nav-item active">
          <i data-lucide="home" class="w-6 h-6"></i>
          <span class="np-bottom-nav-label">홈</span>
        </div>

        <div class="np-bottom-nav-item">
          <i data-lucide="briefcase" class="w-6 h-6"></i>
          <span class="np-bottom-nav-label">일자리</span>
        </div>

        <div class="np-bottom-nav-item">
          <i data-lucide="file-pen-line" class="w-6 h-6"></i>
          <span class="np-bottom-nav-label">이력서 등록</span>
        </div>

        <div class="np-bottom-nav-item">
          <i data-lucide="circle-user" class="w-6 h-6"></i>
          <span class="np-bottom-nav-label">내 계정</span>
        </div>

      </nav>
    </div>
  </section>

  <!-- Active: 일자리 선택 -->
  <section class="mb-6">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-3">Active — 일자리 선택</h2>
    <div class="border border-neutral-200 rounded-card overflow-hidden">
      <nav class="np-bottom-nav">

        <div class="np-bottom-nav-item">
          <i data-lucide="home" class="w-6 h-6"></i>
          <span class="np-bottom-nav-label">홈</span>
        </div>

        <div class="np-bottom-nav-item active">
          <i data-lucide="briefcase" class="w-6 h-6"></i>
          <span class="np-bottom-nav-label">일자리</span>
        </div>

        <div class="np-bottom-nav-item">
          <i data-lucide="file-pen-line" class="w-6 h-6"></i>
          <span class="np-bottom-nav-label">이력서 등록</span>
        </div>

        <div class="np-bottom-nav-item">
          <i data-lucide="circle-user" class="w-6 h-6"></i>
          <span class="np-bottom-nav-label">내 계정</span>
        </div>

      </nav>
    </div>
  </section>

</div>
