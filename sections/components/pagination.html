<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">페이지네이션 (Pagination)</h1>
  <p class="text-neutral-600 mb-8">목록 페이지 이동 컨트롤</p>

  <!-- Default -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Default</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex justify-center">
      <nav class="np-pagination" aria-label="페이지 이동">
        <button class="np-page-btn np-page-btn-disabled" disabled aria-label="이전">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button class="np-page-btn np-page-btn-active" aria-current="page">1</button>
        <button class="np-page-btn">2</button>
        <button class="np-page-btn">3</button>
        <button class="np-page-btn">4</button>
        <button class="np-page-btn">5</button>
        <button class="np-page-btn" aria-label="다음">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </nav>
    </div>
  </section>

  <!-- Middle Page -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">중간 페이지 선택</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex justify-center">
      <nav class="np-pagination" aria-label="페이지 이동">
        <button class="np-page-btn" aria-label="이전">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button class="np-page-btn">1</button>
        <button class="np-page-btn">2</button>
        <button class="np-page-btn np-page-btn-active" aria-current="page">3</button>
        <button class="np-page-btn">4</button>
        <button class="np-page-btn">5</button>
        <button class="np-page-btn" aria-label="다음">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </nav>
    </div>
  </section>

  <!-- Last Page -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">마지막 페이지</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex justify-center">
      <nav class="np-pagination" aria-label="페이지 이동">
        <button class="np-page-btn" aria-label="이전">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button class="np-page-btn">1</button>
        <button class="np-page-btn">2</button>
        <button class="np-page-btn">3</button>
        <button class="np-page-btn">4</button>
        <button class="np-page-btn np-page-btn-active" aria-current="page">5</button>
        <button class="np-page-btn np-page-btn-disabled" disabled aria-label="다음">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </nav>
    </div>
  </section>

  <!-- Mobile Pagination -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">모바일 (Mobile)</h2>
    <div class="flex flex-col gap-4 max-w-sm">

      <!-- 첫 번째 페이지 -->
      <div class="bg-neutral-0 border border-neutral-200 rounded-card px-4 py-3">
        <nav class="np-pagination-mobile" aria-label="페이지 이동">
          <button class="np-pagination-mobile-btn" disabled aria-label="이전 페이지">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
            이전
          </button>
          <span class="np-pagination-mobile-indicator" aria-live="polite">1 / 5</span>
          <button class="np-pagination-mobile-btn" aria-label="다음 페이지">
            다음
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </nav>
      </div>

      <!-- 중간 페이지 -->
      <div class="bg-neutral-0 border border-neutral-200 rounded-card px-4 py-3">
        <nav class="np-pagination-mobile" aria-label="페이지 이동">
          <button class="np-pagination-mobile-btn" aria-label="이전 페이지">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
            이전
          </button>
          <span class="np-pagination-mobile-indicator" aria-live="polite">3 / 5</span>
          <button class="np-pagination-mobile-btn" aria-label="다음 페이지">
            다음
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </nav>
      </div>

      <!-- 마지막 페이지 -->
      <div class="bg-neutral-0 border border-neutral-200 rounded-card px-4 py-3">
        <nav class="np-pagination-mobile" aria-label="페이지 이동">
          <button class="np-pagination-mobile-btn" aria-label="이전 페이지">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
            이전
          </button>
          <span class="np-pagination-mobile-indicator" aria-live="polite">5 / 5</span>
          <button class="np-pagination-mobile-btn" disabled aria-label="다음 페이지">
            다음
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </nav>
      </div>

    </div>
  </section>

  <!-- Many Pages with Ellipsis -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">많은 페이지 (말줄임)</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex justify-center">
      <nav class="np-pagination" aria-label="페이지 이동">
        <button class="np-page-btn" aria-label="이전">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button class="np-page-btn">1</button>
        <span class="np-page-btn border-transparent bg-transparent cursor-default hover:bg-transparent hover:text-neutral-600 text-neutral-400">…</span>
        <button class="np-page-btn">4</button>
        <button class="np-page-btn np-page-btn-active" aria-current="page">5</button>
        <button class="np-page-btn">6</button>
        <span class="np-page-btn border-transparent bg-transparent cursor-default hover:bg-transparent hover:text-neutral-600 text-neutral-400">…</span>
        <button class="np-page-btn">12</button>
        <button class="np-page-btn" aria-label="다음">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </nav>
    </div>
  </section>

</div>
