<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">프로그레스 (Progress)</h1>
  <p class="text-neutral-600 mb-8">작업 진행 상태를 시각화하는 컴포넌트</p>

  <!-- Sizes -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">크기 (Size)</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col gap-6">

      <div class="np-progress-wrap">
        <div class="flex justify-between items-center mb-2">
          <span class="np-progress-label">Small</span>
          <span class="np-progress-value">67%</span>
        </div>
        <div class="np-progress-track np-progress-track-sm">
          <div class="np-progress-fill" style="width:67%"></div>
        </div>
      </div>

      <div class="np-progress-wrap">
        <div class="flex justify-between items-center mb-2">
          <span class="np-progress-label">Medium (기본)</span>
          <span class="np-progress-value">67%</span>
        </div>
        <div class="np-progress-track">
          <div class="np-progress-fill" style="width:67%"></div>
        </div>
      </div>

      <div class="np-progress-wrap">
        <div class="flex justify-between items-center mb-2">
          <span class="np-progress-label">Large</span>
          <span class="np-progress-value">67%</span>
        </div>
        <div class="np-progress-track np-progress-track-lg">
          <div class="np-progress-fill" style="width:67%"></div>
        </div>
      </div>

    </div>
  </section>

  <!-- States -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">상태 (State)</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col gap-6">

      <div class="np-progress-wrap">
        <div class="flex justify-between items-center mb-2">
          <span class="np-progress-label">시작 전</span>
          <span class="np-progress-value">0%</span>
        </div>
        <div class="np-progress-track">
          <div class="np-progress-fill" style="width:0%"></div>
        </div>
      </div>

      <div class="np-progress-wrap">
        <div class="flex justify-between items-center mb-2">
          <span class="np-progress-label">진행 중</span>
          <span class="np-progress-value">45%</span>
        </div>
        <div class="np-progress-track">
          <div class="np-progress-fill" style="width:45%"></div>
        </div>
      </div>

      <div class="np-progress-wrap">
        <div class="flex justify-between items-center mb-2">
          <span class="np-progress-label">완료</span>
          <span class="np-progress-value">100%</span>
        </div>
        <div class="np-progress-track">
          <div class="np-progress-fill" style="width:100%"></div>
        </div>
      </div>

      <div class="np-progress-wrap np-progress-indeterminate">
        <span class="np-progress-label mb-2 block">로딩 중 (Indeterminate)</span>
        <div class="np-progress-track">
          <div class="np-progress-fill"></div>
        </div>
      </div>

    </div>
  </section>

  <!-- Label variants -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">레이블 없음</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col gap-4">
      <div class="np-progress-track">
        <div class="np-progress-fill" style="width:30%"></div>
      </div>
      <div class="np-progress-track">
        <div class="np-progress-fill" style="width:60%"></div>
      </div>
      <div class="np-progress-track">
        <div class="np-progress-fill" style="width:90%"></div>
      </div>
    </div>
  </section>

</div>
