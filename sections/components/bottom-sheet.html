<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">바텀 시트 (Bottom Sheet)</h1>
  <p class="text-neutral-600 mb-8">하단에서 올라오는 모바일 패널 컴포넌트 · 모바일 뷰포트 프리뷰</p>

  <!-- 기본형 -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">기본형</h2>
    <div class="relative bg-warm-grey-100 rounded-card overflow-hidden" style="height:420px">
      <div class="np-bottom-sheet-overlay"></div>
      <div class="np-bottom-sheet">
        <div class="np-bottom-sheet-handle"></div>
        <div class="np-bottom-sheet-header">
          <p class="np-bottom-sheet-title">지원 완료</p>
        </div>
        <div class="np-bottom-sheet-body">
          <p class="text-base text-neutral-600 leading-relaxed">
            영등포구 영동초 교실 미화 1명 구인 공고에 지원이 완료되었습니다.<br>
            담당자 확인 후 연락드릴 예정입니다.
          </p>
        </div>
        <div class="np-bottom-sheet-footer">
          <button class="np-btn np-btn-primary np-btn-md w-full">확인</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 목록형 -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">목록형 (액션 선택)</h2>
    <div class="relative bg-warm-grey-100 rounded-card overflow-hidden" style="height:380px">
      <div class="np-bottom-sheet-overlay"></div>
      <div class="np-bottom-sheet">
        <div class="np-bottom-sheet-handle"></div>
        <div class="np-bottom-sheet-header">
          <p class="np-bottom-sheet-title">더보기</p>
        </div>
        <div class="np-bottom-sheet-body flex flex-col gap-1 py-2">
          <button class="flex items-center gap-3 w-full px-2 py-3 rounded-button text-left text-base text-neutral-800 hover:bg-neutral-50 transition-colors duration-[120ms]">
            <i data-lucide="bookmark" class="w-5 h-5"></i>
            저장하기
          </button>
          <button class="flex items-center gap-3 w-full px-2 py-3 rounded-button text-left text-base text-neutral-800 hover:bg-neutral-50 transition-colors duration-[120ms]">
            <i data-lucide="share-2" class="w-5 h-5"></i>
            공유하기
          </button>
          <button class="flex items-center gap-3 w-full px-2 py-3 rounded-button text-left text-base text-error-500 hover:bg-neutral-50 transition-colors duration-[120ms]">
            <i data-lucide="ban" class="w-5 h-5"></i>
            관심 없음
          </button>
        </div>
        <div class="np-bottom-sheet-footer">
          <button class="np-btn np-btn-grey-stroke np-btn-md w-full">닫기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 필터형 -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">필터형</h2>
    <div class="relative bg-warm-grey-100 rounded-card overflow-hidden" style="height:460px">
      <div class="np-bottom-sheet-overlay"></div>
      <div class="np-bottom-sheet">
        <div class="np-bottom-sheet-handle"></div>
        <div class="np-bottom-sheet-header">
          <p class="np-bottom-sheet-title">필터</p>
        </div>
        <div class="np-bottom-sheet-body flex flex-col gap-5">
          <div>
            <p class="text-base font-bold text-neutral-800 mb-3">근무 형태</p>
            <div class="flex flex-wrap gap-2">
              <button class="np-chip np-chip-active">전체</button>
              <button class="np-chip">파트타임</button>
              <button class="np-chip">풀타임</button>
              <button class="np-chip">공공일자리</button>
            </div>
          </div>
          <div class="border-t border-neutral-100"></div>
          <div>
            <p class="text-base font-bold text-neutral-800 mb-3">근무 요일</p>
            <div class="flex flex-wrap gap-2">
              <button class="np-chip">주 2일</button>
              <button class="np-chip np-chip-active">주 3일</button>
              <button class="np-chip">주 4일</button>
              <button class="np-chip">주 5일</button>
            </div>
          </div>
        </div>
        <div class="np-bottom-sheet-footer flex gap-3">
          <button class="np-btn np-btn-grey-stroke np-btn-md flex-1">초기화</button>
          <button class="np-btn np-btn-primary np-btn-md flex-1">적용하기</button>
        </div>
      </div>
    </div>
  </section>

</div>
