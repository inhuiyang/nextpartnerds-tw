<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">칩 (Chip)</h1>
  <p class="text-neutral-600 mb-8">필터·태그 선택에 사용하는 토글형 컴포넌트</p>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Default / Active</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-wrap gap-2">
      <button class="np-chip">마케팅</button>
      <button class="np-chip np-chip-active">영업</button>
      <button class="np-chip">경영기획</button>
      <button class="np-chip np-chip-active">IT·개발</button>
      <button class="np-chip">인사·총무</button>
      <button class="np-chip">재무·회계</button>
      <button class="np-chip np-chip-active">디자인</button>
      <button class="np-chip">생산·제조</button>
    </div>
  </section>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">With Icon</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-wrap gap-2">
      <button class="np-chip np-chip-active">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        서울
      </button>
      <button class="np-chip">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        경기도
      </button>
      <button class="np-chip">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        부산
      </button>
      <button class="np-chip np-chip-active">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"/></svg>
        저장됨
        <svg class="w-4 h-4 text-primary-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </section>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">실사용 예시 — 직무 필터</h2>
    <div class="bg-neutral-50 border border-neutral-200 rounded-card p-6">
      <p class="text-lg font-semibold text-neutral-800 mb-3">직무 선택</p>
      <div class="flex flex-wrap gap-2" id="chip-demo">
        <button class="np-chip np-chip-active" onclick="toggleChip(this)">전체</button>
        <button class="np-chip" onclick="toggleChip(this)">마케팅</button>
        <button class="np-chip" onclick="toggleChip(this)">영업</button>
        <button class="np-chip" onclick="toggleChip(this)">IT·개발</button>
        <button class="np-chip" onclick="toggleChip(this)">디자인</button>
        <button class="np-chip" onclick="toggleChip(this)">경영기획</button>
        <button class="np-chip" onclick="toggleChip(this)">인사·총무</button>
      </div>
    </div>
  </section>
</div>

<script>
function toggleChip(el) {
  el.classList.toggle('np-chip-active');
}
</script>
