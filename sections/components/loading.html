<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">로딩 (Loading)</h1>
  <p class="text-neutral-600 mb-8">데이터 로딩 상태를 나타내는 컴포넌트</p>

  <!-- Spinner Sizes -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Spinner — 크기</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex items-center gap-8">
      <div class="flex flex-col items-center gap-2">
        <div class="np-spinner np-spinner-sm"></div>
        <span class="text-xs text-neutral-400">Small</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="np-spinner np-spinner-md"></div>
        <span class="text-xs text-neutral-400">Medium</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <div class="np-spinner np-spinner-lg"></div>
        <span class="text-xs text-neutral-400">Large</span>
      </div>
    </div>
  </section>

  <!-- Spinner with Label -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Spinner — 텍스트 포함</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col items-center gap-3">
      <div class="np-spinner np-spinner-lg"></div>
      <p class="text-base text-neutral-600">일자리 정보를 불러오는 중입니다…</p>
    </div>
  </section>

  <!-- Skeleton — Job Card -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Skeleton — 잡 카드</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-5 flex flex-col gap-3">
      <!-- 상단 -->
      <div class="flex justify-end">
        <div class="np-skeleton h-4 w-24 rounded-pill"></div>
      </div>
      <!-- 제목 -->
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1 flex flex-col gap-2">
          <div class="np-skeleton h-5 w-full"></div>
          <div class="np-skeleton h-5 w-3/4"></div>
        </div>
        <div class="np-skeleton w-8 h-8 rounded-button shrink-0"></div>
      </div>
      <!-- 기업명 -->
      <div class="np-skeleton h-4 w-1/3"></div>
      <!-- 구분선 -->
      <div class="border-t border-neutral-100"></div>
      <!-- 메타 -->
      <div class="np-skeleton h-4 w-2/3"></div>
      <div class="np-skeleton h-4 w-1/2"></div>
      <!-- 급여 -->
      <div class="np-skeleton h-6 w-1/3 rounded-pill"></div>
      <!-- 버튼 -->
      <div class="np-skeleton h-10 w-full rounded-button mt-auto"></div>
    </div>
  </section>

  <!-- Skeleton — List -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Skeleton — 목록</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card divide-y divide-neutral-100">
      <div class="flex items-center justify-between px-4 py-4 gap-4">
        <div class="flex flex-col gap-2 flex-1">
          <div class="np-skeleton h-4 w-3/4"></div>
          <div class="np-skeleton h-3 w-1/2"></div>
        </div>
        <div class="np-skeleton h-6 w-16 rounded-pill shrink-0"></div>
      </div>
      <div class="flex items-center justify-between px-4 py-4 gap-4">
        <div class="flex flex-col gap-2 flex-1">
          <div class="np-skeleton h-4 w-2/3"></div>
          <div class="np-skeleton h-3 w-1/3"></div>
        </div>
        <div class="np-skeleton h-6 w-16 rounded-pill shrink-0"></div>
      </div>
      <div class="flex items-center justify-between px-4 py-4 gap-4">
        <div class="flex flex-col gap-2 flex-1">
          <div class="np-skeleton h-4 w-4/5"></div>
          <div class="np-skeleton h-3 w-2/5"></div>
        </div>
        <div class="np-skeleton h-6 w-16 rounded-pill shrink-0"></div>
      </div>
    </div>
  </section>

  <!-- Overlay Demo -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Overlay</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col items-center gap-4">
      <p class="text-sm text-neutral-600">전체 화면을 덮는 로딩 오버레이입니다.</p>
      <button id="overlay-trigger" class="np-btn np-btn-primary np-btn-sm">오버레이 미리보기</button>
    </div>

    <!-- Overlay (숨김 상태) -->
    <div id="np-overlay" class="fixed inset-0 flex items-center justify-center z-50" style="background:rgba(26,26,26,0.45);display:none">
      <div class="bg-neutral-0 rounded-card p-8 flex flex-col items-center gap-4 shadow-[0_4px_24px_rgba(0,0,0,0.16)]">
        <div class="np-spinner np-spinner-lg"></div>
        <p class="text-base text-neutral-800 font-bold">잠시만 기다려 주세요</p>
        <p class="text-sm text-neutral-600">일자리 정보를 불러오는 중입니다…</p>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
  function showOverlay() {
    var el = document.getElementById('np-overlay');
    if (!el) return;
    el.style.display = 'flex';
    setTimeout(function () { el.style.display = 'none'; }, 2500);
  }

  function onClick(e) {
    if (e.target.closest('#overlay-trigger')) showOverlay();
  }

  document.addEventListener('click', onClick);
  window._sectionCleanup = function () {
    document.removeEventListener('click', onClick);
  };
})();
</script>
