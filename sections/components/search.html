<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">검색 (Search)</h1>
  <p class="text-neutral-600 mb-8">Search Field · Search View</p>

  <!-- ── Search Field ── -->
  <h2 class="text-xl font-bold text-neutral-900 mb-1">Search Field</h2>
  <p class="text-neutral-600 mb-6">검색 입력 필드 상태</p>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">States</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col gap-5">

      <div>
        <p class="text-base text-neutral-400 mb-2">Default</p>
        <div class="np-search">
          <i data-lucide="search" class="np-search-icon w-6 h-6"></i>
          <input type="text" class="np-search-input" placeholder="직무, 회사명으로 검색" />
        </div>
      </div>

      <div>
        <p class="text-base text-neutral-400 mb-2">With Value</p>
        <div class="np-search">
          <i data-lucide="search" class="np-search-icon w-6 h-6"></i>
          <input type="text" class="np-search-input" value="마케팅 팀장" id="sf-value" />
          <button id="sf-clear-btn" class="np-search-clear">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <div>
        <p class="text-base text-neutral-400 mb-2">Disabled</p>
        <div class="np-search opacity-60 pointer-events-none">
          <i data-lucide="search" class="np-search-icon w-6 h-6"></i>
          <input type="text" class="np-search-input" placeholder="검색을 사용할 수 없습니다" disabled />
        </div>
      </div>

    </div>
  </section>

  <!-- ── Search View ── -->
  <div class="border-t border-neutral-200 my-10"></div>
  <h2 class="text-xl font-bold text-neutral-900 mb-1">Search View</h2>
  <p class="text-neutral-600 mb-6">직접 타이핑해서 검색 흐름을 확인하세요</p>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Interactive Demo</h2>
    <div class="bg-neutral-50 border border-neutral-200 rounded-card p-6">

      <div class="relative" id="sv-root">

        <div class="np-search">
          <i data-lucide="search" class="np-search-icon w-6 h-6"></i>
          <input type="text" id="sv-input" class="np-search-input" placeholder="직무, 회사명으로 검색" autocomplete="off" />
          <button id="sv-clear" class="np-search-clear" style="display:none">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div id="sv-drop" class="np-search-view absolute left-0 right-0 mt-2 z-10" style="display:none">

          <div id="sv-recent">
            <p class="np-search-section-label">최근 검색어</p>
            <div class="np-search-item" data-kw="마케팅 팀장">
              <i data-lucide="clock" class="w-5 h-5 text-neutral-400 shrink-0"></i>
              <span class="flex-1">마케팅 팀장</span>
            </div>
            <div class="np-search-item" data-kw="넥스트파트너">
              <i data-lucide="clock" class="w-5 h-5 text-neutral-400 shrink-0"></i>
              <span class="flex-1">넥스트파트너</span>
            </div>
            <div class="np-search-item" data-kw="IT 개발 시니어">
              <i data-lucide="clock" class="w-5 h-5 text-neutral-400 shrink-0"></i>
              <span class="flex-1">IT 개발 시니어</span>
            </div>
          </div>

          <div id="sv-suggest" style="display:none">
            <p class="np-search-section-label">추천 검색어</p>
            <div id="sv-suggest-list"></div>
            <div class="np-search-divider my-1"></div>
            <p class="np-search-section-label">관련 회사</p>
            <div id="sv-company-list"></div>
          </div>

          <div id="sv-empty" style="display:none" class="py-10 flex flex-col items-center gap-2">
            <i data-lucide="search" class="w-10 h-10 text-neutral-200"></i>
            <p class="text-lg font-semibold text-neutral-800">검색 결과가 없습니다</p>
            <p class="text-base text-neutral-400">다른 키워드로 다시 검색해보세요</p>
          </div>

        </div>
      </div>

      <p class="text-sm text-neutral-400 mt-4">"마케팅" · "IT" · "디자인" 등을 입력해보세요</p>
    </div>
  </section>

</div>

<script>
(function() {
  var KEYWORDS = [
    { label: '마케팅 팀장',        company: '마케토피아' },
    { label: '마케팅 기획',        company: '마케팅랩' },
    { label: '마케팅 콘텐츠',      company: null },
    { label: 'IT 개발 시니어',     company: 'IT솔루션즈' },
    { label: 'IT 프로젝트 매니저', company: null },
    { label: '디자인 리드',        company: '디자인팩토리' },
    { label: '디자이너 수석',      company: null },
    { label: '영업 팀장',          company: '영업파트너스' },
    { label: '경영기획 임원',      company: null },
    { label: '인사 총무 팀장',     company: null },
  ];

  /* ── 요소를 매번 직접 조회 (타이밍 문제 회피) ── */
  function el(id) { return document.getElementById(id); }

  function showDrop(q) {
    var drop = el('sv-drop');
    if (!drop) return;
    drop.style.display = 'block';

    var recent  = el('sv-recent');
    var suggest = el('sv-suggest');
    var empty   = el('sv-empty');

    if (!q || !q.trim()) {
      if (recent)  recent.style.display  = 'block';
      if (suggest) suggest.style.display = 'none';
      if (empty)   empty.style.display   = 'none';
      return;
    }

    if (recent) recent.style.display = 'none';
    var matches = KEYWORDS.filter(function(k) { return k.label.indexOf(q) !== -1; });

    if (matches.length === 0) {
      if (suggest) suggest.style.display = 'none';
      if (empty)   empty.style.display   = 'block';
      return;
    }

    if (empty)   empty.style.display   = 'none';
    if (suggest) suggest.style.display = 'block';

    var companies = matches.filter(function(k) { return k.company; });
    var sList = el('sv-suggest-list');
    var cList = el('sv-company-list');

    if (sList) {
      sList.innerHTML = matches.map(function(k) {
        var h = k.label.replace(q, '<span class="np-search-item-keyword">' + q + '</span>');
        return '<div class="np-search-item" data-kw="' + k.label + '">'
          + '<i data-lucide="search" class="w-5 h-5 text-neutral-400 shrink-0"></i>'
          + '<span>' + h + '</span></div>';
      }).join('');
    }

    if (cList) {
      cList.innerHTML = companies.length
        ? companies.map(function(k) {
            var h = k.company.replace(q, '<span class="np-search-item-keyword">' + q + '</span>');
            return '<div class="np-search-item" data-kw="' + k.company + '">'
              + '<i data-lucide="building-2" class="w-5 h-5 text-neutral-400 shrink-0"></i>'
              + '<span>' + h + '</span></div>';
          }).join('')
        : '<p class="text-base text-neutral-400 px-4 py-3">관련 회사 없음</p>';
    }
    if (window.lucide) lucide.createIcons({ nameAttr: 'data-lucide' });
  }

  function hideDrop() {
    var drop = el('sv-drop');
    if (drop) drop.style.display = 'none';
  }

  function selectKw(kw) {
    var input    = el('sv-input');
    var clearBtn = el('sv-clear');
    if (input)    input.value = kw;
    if (clearBtn) clearBtn.style.display = 'block';
    hideDrop();
    if (input) input.focus();
  }

  /* ── document 레벨 이벤트 위임 ── */

  function onFocusin(e) {
    if (e.target && e.target.id === 'sv-input') {
      showDrop(e.target.value);
    }
  }

  function onInput(e) {
    if (e.target && e.target.id === 'sv-input') {
      var q        = e.target.value;
      var clearBtn = el('sv-clear');
      if (clearBtn) clearBtn.style.display = q ? 'block' : 'none';
      showDrop(q);
    }
    if (e.target && e.target.id === 'sf-value') {
      var btn = el('sf-clear-btn');
      if (btn) btn.style.display = e.target.value ? 'block' : 'none';
    }
  }

  function onClick(e) {
    /* sf-clear-btn: With Value 필드 클리어 */
    if (e.target.closest('#sf-clear-btn')) {
      var inp = el('sf-value');
      var btn = el('sf-clear-btn');
      if (inp) inp.value = '';
      if (btn) btn.style.display = 'none';
      if (inp) inp.focus();
      return;
    }

    /* sv-clear: 인터랙티브 데모 클리어 */
    if (e.target.closest('#sv-clear')) {
      var input    = el('sv-input');
      var clearBtn = el('sv-clear');
      if (input)    input.value = '';
      if (clearBtn) clearBtn.style.display = 'none';
      hideDrop();
      if (input) input.focus();
      return;
    }

    /* 드롭다운 항목 클릭 */
    var item = e.target.closest('[data-kw]');
    if (item && item.closest('#sv-drop')) {
      selectKw(item.dataset.kw);
      return;
    }

    /* 외부 클릭 → 닫기 */
    if (!e.target.closest('#sv-root')) {
      hideDrop();
    }
  }

  document.addEventListener('focusin', onFocusin);
  document.addEventListener('input',   onInput);
  document.addEventListener('click',   onClick);

  window._sectionCleanup = function() {
    document.removeEventListener('focusin', onFocusin);
    document.removeEventListener('input',   onInput);
    document.removeEventListener('click',   onClick);
  };
})();
</script>
