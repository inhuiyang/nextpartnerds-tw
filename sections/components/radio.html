<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">라디오 버튼 (Radio Button)</h1>
  <p class="text-neutral-600 mb-8">Default / Selected / Disabled</p>

  <!-- States -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">States</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col gap-5">

      <label class="np-radio">
        <input type="radio" name="state-demo" class="np-radio-input" />
        <span class="np-radio-label">Default (미선택)</span>
      </label>

      <label class="np-radio">
        <input type="radio" name="state-demo" class="np-radio-input" checked />
        <span class="np-radio-label">Selected (선택됨)</span>
      </label>

      <label class="np-radio">
        <input type="radio" name="state-disabled" class="np-radio-input" disabled />
        <span class="np-radio-label text-neutral-400">Disabled (미선택)</span>
      </label>

      <label class="np-radio">
        <input type="radio" name="state-disabled" class="np-radio-input" checked disabled />
        <span class="np-radio-label text-neutral-400">Disabled Selected (선택 비활성)</span>
      </label>

    </div>
  </section>

  <!-- 실사용 예시 — 고용 형태 -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">실사용 예시 — 고용 형태</h2>
    <div class="bg-neutral-50 border border-neutral-200 rounded-card p-6 flex flex-col gap-4">
      <p class="text-lg font-semibold text-neutral-800 mb-1">고용 형태를 선택하세요</p>

      <label class="np-radio">
        <input type="radio" name="employment" class="np-radio-input" checked />
        <span class="np-radio-label">정규직</span>
      </label>
      <label class="np-radio">
        <input type="radio" name="employment" class="np-radio-input" />
        <span class="np-radio-label">계약직</span>
      </label>
      <label class="np-radio">
        <input type="radio" name="employment" class="np-radio-input" />
        <span class="np-radio-label">파트타임 · 아르바이트</span>
      </label>
      <label class="np-radio">
        <input type="radio" name="employment" class="np-radio-input" />
        <span class="np-radio-label">프리랜서</span>
      </label>
    </div>
  </section>

  <!-- 실사용 예시 — 희망 연봉 -->
  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">실사용 예시 — 희망 연봉</h2>
    <div class="bg-neutral-50 border border-neutral-200 rounded-card p-6 flex flex-col gap-4">
      <p class="text-lg font-semibold text-neutral-800 mb-1">희망 연봉 범위</p>

      <label class="np-radio">
        <input type="radio" name="salary" class="np-radio-input" />
        <span class="np-radio-label">3,000만 원 미만</span>
      </label>
      <label class="np-radio">
        <input type="radio" name="salary" class="np-radio-input" checked />
        <span class="np-radio-label">3,000 ~ 4,000만 원</span>
      </label>
      <label class="np-radio">
        <input type="radio" name="salary" class="np-radio-input" />
        <span class="np-radio-label">4,000 ~ 5,000만 원</span>
      </label>
      <label class="np-radio">
        <input type="radio" name="salary" class="np-radio-input" />
        <span class="np-radio-label">5,000만 원 이상</span>
      </label>
      <label class="np-radio">
        <input type="radio" name="salary" class="np-radio-input" />
        <span class="np-radio-label">회사 내규에 따름</span>
      </label>
    </div>
  </section>

</div>
