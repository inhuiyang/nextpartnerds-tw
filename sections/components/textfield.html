<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-neutral-900 mb-1">텍스트 필드 (Text Field)</h1>
  <p class="text-neutral-600 mb-8">Default / Error / Disabled 상태</p>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Default</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col gap-6">
      <div class="np-textfield-wrap">
        <label class="np-textfield-label">이름</label>
        <input type="text" class="np-textfield" placeholder="이름을 입력하세요" />
      </div>
      <div class="np-textfield-wrap">
        <label class="np-textfield-label">이메일</label>
        <input type="email" class="np-textfield" value="senior@nextpartner.co.kr" />
        <span class="np-textfield-hint">이메일 주소로 채용 소식을 받습니다</span>
      </div>
      <div class="np-textfield-wrap">
        <label class="np-textfield-label">전화번호</label>
        <input type="tel" class="np-textfield" placeholder="010-0000-0000" />
        <span class="np-textfield-hint">'-' 없이 숫자만 입력하세요</span>
      </div>
    </div>
  </section>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Error</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col gap-6">
      <div class="np-textfield-wrap">
        <label class="np-textfield-label">이메일</label>
        <input type="email" class="np-textfield np-textfield-error" value="잘못된이메일" />
        <span class="np-textfield-hint-error">올바른 이메일 형식을 입력하세요</span>
      </div>
      <div class="np-textfield-wrap">
        <label class="np-textfield-label">비밀번호</label>
        <input type="password" class="np-textfield np-textfield-error" value="1234" />
        <span class="np-textfield-hint-error">비밀번호는 8자 이상이어야 합니다</span>
      </div>
    </div>
  </section>

  <section class="mb-10">
    <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-widest mb-4">Disabled</h2>
    <div class="bg-neutral-0 border border-neutral-200 rounded-card p-6 flex flex-col gap-6">
      <div class="np-textfield-wrap">
        <label class="np-textfield-label" style="opacity:0.4">아이디</label>
        <input type="text" class="np-textfield" value="user_2024" disabled />
        <span class="np-textfield-hint">아이디는 변경할 수 없습니다</span>
      </div>
      <div class="np-textfield-wrap">
        <label class="np-textfield-label" style="opacity:0.4">소속 회사</label>
        <input type="text" class="np-textfield" placeholder="자동 입력됩니다" disabled />
      </div>
    </div>
  </section>
</div>
